name: Belge Denetimi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  denetim:
    name: Markdown ve Bağlantı Denetimi
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Belge denetim betiğini çalıştır
        run: |
          python3 scripts/check_docs.py
